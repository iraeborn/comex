version: '3'

services:
  nginx:
    image: nginx:latest
    ports:
      - "${NGINX_FRONT_PORT}:80"
      - "${NGINX_SERVER_PORT}:3000"
    depends_on:
      - php
      - node
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/api:/var/www/api
    environment:
      - TZ=${TZ}
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    working_dir: /var/www/api
    tty: true
    depends_on:
      - mysql
    volumes:
      - ./src/api:/var/www/api
  node:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    working_dir: /var/www/web
    tty: true
    ports:
      - "33000:3000"
    expose:
      - 3000
    volumes:
      - ./src/web:/var/www/web
  mysql:
    image: mysql:8.0
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - ${MYSQL_PORT}:3306
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ}
volumes:
  mysql-data:
    external: false
